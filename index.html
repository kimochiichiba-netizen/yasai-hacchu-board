<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>やさい発注ボード｜ご注文</title>
  <meta name="theme-color" content="#2e7d32" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A5%AC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="app">
    <h1>🥬 やさい発注ボード</h1>
    <div class="sub">株式会社気持ち市場 — ご注文フォーム</div>
  </header>

  <div class="wrap">
    <!-- おすすめだけ表示トグル -->
    <div style="text-align:center;margin-bottom:12px">
      <button class="btn" id="recoToggle">🥗 おすすめだけ表示（今安い・これから安くなる）</button>
    </div>
    <!-- おすすめ（品目名をタップするとその品目へ移動） -->
    <div class="reco" id="reco"></div>

    <!-- 取引先情報 -->
    <div class="card">
      <h2>お客様情報</h2>
      <div class="grid2">
        <div class="field">
          <label>店舗・会社名 <span style="color:#c62828">*</span></label>
          <input id="partner" placeholder="例：〇〇商店" autocomplete="organization" />
        </div>
        <div class="field">
          <label>ご担当者・連絡先（任意）</label>
          <input id="contact" placeholder="例：田中 / 090-0000-0000" />
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>注文日</label>
          <input id="orderDate" type="date" />
        </div>
        <div class="field">
          <label>入荷希望日（任意）</label>
          <input id="deliveryDate" type="date" />
        </div>
      </div>
      <!-- スパム対策: 人間には見えないハニーポット -->
      <div style="position:absolute;left:-9999px" aria-hidden="true">
        <label>この欄は入力しないでください</label>
        <input id="website" tabindex="-1" autocomplete="off" />
      </div>
    </div>

    <!-- 商品一覧 -->
    <div class="card">
      <h2>ご注文品目（数量を入れた品目だけ送られます）</h2>
      <p class="muted" style="font-size:0.83rem;margin-top:-6px">
        欲しい品目に「数量」を入れてください。サイズ・品種・希望金額は任意です。
      </p>
      <div id="catalog"></div>
    </div>

    <div class="card">
      <h2>🥕 リクエスト野菜・果物（任意）</h2>
      <p class="muted" style="font-size:0.83rem;margin-top:-6px">一覧にない品目・「こんなのが欲しい」をご自由にどうぞ。</p>
      <textarea id="request" rows="2" placeholder="例：オクラ追加、地元の珍しい野菜があれば 等"></textarea>
    </div>

    <div class="field">
      <label>備考・連絡事項（任意）</label>
      <textarea id="note" rows="2" placeholder="例：午前中に届けてほしい など"></textarea>
    </div>
  </div>

  <div class="summary-bar">
    <span class="count" id="count">選択 0 品目</span>
    <button class="btn" id="submitBtn">この内容で注文する</button>
  </div>

  <div class="mode-note" id="modeNote"></div>
  <div class="toast" id="toast"></div>

  <!-- 送信完了パネル（控えの印刷はなし） -->
  <div class="modal-bg" id="afterSubmit">
    <div class="modal" style="max-width:380px;text-align:center">
      <h2 style="color:#2e7d32">✅ 注文を送信しました</h2>
      <p class="muted" style="font-size:0.9rem" id="afterMsg"></p>
      <div class="btnbar" style="justify-content:center">
        <button class="btn" id="closeAfter">続けて注文する</button>
      </div>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/config.js" onerror="void 0"></script>
  <script src="assets/store.js"></script>
  <script src="assets/order.js"></script>
</body>
</html>
